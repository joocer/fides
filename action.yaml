name: 'Fides Secret Scanner'
description: 'Fides - helping you keep secrets secret'
branding:
  icon: 'shield'
  color: 'red'
inputs:
  fail-on-secrets:
    description: 'Fail the action if secrets are found'
    required: false
    default: 'true'
  config-file:
    description: 'Path to configuration file'
    required: false
  verbose:
    description: 'Enable verbose output'
    required: false
    default: 'false'
  json-report:
    description: >
      Write findings to this path as JSON, resolved against GITHUB_WORKSPACE.
      Written before the action fails, so a caller reading it needs
      `if: always()`. Empty (the default) writes no report.
    required: false
    default: ''

runs:
  using: "composite"
  steps:
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
      
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        path: subject

    - name: Check out Fides code
      uses: actions/checkout@v4
      with:
        repository: joocer/fides
        path: fides

    - name: Install Fides Requirements
      run: pip install -r fides/requirements.txt
      shell: bash

    - name: Run Fides
      run: |
        # Inputs arrive as env vars, not template interpolation, so a path
        # with a space or a quote in it cannot break out of the command.
        FIDES_ARGS=()
        if [ "$INPUT_VERBOSE" = "true" ]; then
          FIDES_ARGS+=(--verbose)
        fi
        if [ -n "$INPUT_JSON_REPORT" ]; then
          # Resolved before the cd, so a relative path lands beside the
          # caller's workspace rather than inside the checked-out subject.
          case "$INPUT_JSON_REPORT" in
            /*) REPORT="$INPUT_JSON_REPORT" ;;
            *)  REPORT="${GITHUB_WORKSPACE}/${INPUT_JSON_REPORT}" ;;
          esac
          mkdir -p "$(dirname "$REPORT")"
          FIDES_ARGS+=(--json "$REPORT")
        fi
        cd subject
        python ../fides/run.py "${FIDES_ARGS[@]}"
      shell: bash
      env:
        FIDES_FAIL_ON_SECRETS: ${{ inputs.fail-on-secrets }}
        FIDES_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_JSON_REPORT: ${{ inputs.json-report }}
